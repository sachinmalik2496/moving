<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moving sale</title>
    <meta
      name="description"
      content="Household items for sale, with asking price, condition, and photos."
    />
    <meta name="theme-color" content="#1a1714" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..650&family=Outfit:wght@380..600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site">
      <div class="wrap head">
        <div>
          <p class="kicker">Household sale</p>
          <h1 id="title">Moving sale</h1>
          <p class="contact" id="contact" hidden></p>
        </div>
      </div>
    </header>

    <main class="wrap">
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter items">
          <button type="button" data-filter="all" aria-pressed="true">All</button>
          <button type="button" data-filter="available" aria-pressed="false">
            Available
          </button>
          <button type="button" data-filter="sold" aria-pressed="false">Sold</button>
        </div>
        <label class="search">
          <span class="sr-only">Search items</span>
          <input id="search" type="search" placeholder="Search items" autocomplete="off" />
        </label>
      </div>

      <div id="list"></div>
      <p id="error" class="error" hidden></p>
    </main>

    <footer class="wrap foot">
      <p>Click a photo to see it larger. Asking price is the larger number.</p>
    </footer>

    <dialog id="lightbox" aria-label="Item photo">
      <div class="lightbox">
        <button class="icon-btn close" id="lightbox-close" type="button" aria-label="Close">
          ×
        </button>
        <button class="icon-btn nav prev" id="lightbox-prev" type="button" aria-label="Previous photo">
          ‹
        </button>
        <figure>
          <div class="lightbox-frame" id="lightbox-frame"></div>
          <figcaption id="lightbox-caption"></figcaption>
        </figure>
        <button class="icon-btn nav next" id="lightbox-next" type="button" aria-label="Next photo">
          ›
        </button>
      </div>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
